<style>
:root{--bg:#0b1115;--bg2:#101a20;--card:#141f26;--card2:#1b2a33;--bd:rgba(255,255,255,.09);--fg:#e9eef1;--mute:#8fa1ab;--ac:#f0b968;--ac2:#5ad1c8;--glow:0 0 0 1px rgba(240,185,104,.55),0 0 22px rgba(240,185,104,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(900px 520px at 12% -8%,rgba(90,209,200,.11),transparent 60%),radial-gradient(800px 520px at 100% 0,rgba(240,185,104,.10),transparent 55%),var(--bg);background-attachment:fixed}

.sub{color:var(--mute);line-height:1.6;margin:0 0 18px}

.steps span{display:block}
.foot{margin:28px 0 6px;text-align:center;color:var(--mute);font-size:12px;letter-spacing:.08em}

.bd svg{position:absolute;inset:0;width:100%;height:100%}
.ob{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(circle at 30% 18%,#ecca88,#d3a455 58%,#b78a40);border-radius:16px;touch-action:manipulation;user-select:none;margin:10px 0;cursor:pointer;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 3px rgba(70,40,10,.3),0 0 0 1px rgba(240,185,104,.3)}
.ob svg{position:absolute;inset:0;width:100%;height:100%}

.gcard.sel{border-color:var(--ac);box-shadow:var(--glow)}

.b{color:#1a5fb4;border-color:#1a5fb4}.r{color:#c01c28;border-color:#c01c28}
.fz{filter:grayscale(1);opacity:.55}.ar{box-shadow:0 0 0 3px gold,0 3px 6px rgba(0,0,0,.4)}

.mk.lm{width:11%;border-radius:8px;background:rgba(255,196,0,.6);z-index:0}.mk.lf{background:rgba(255,196,0,.28)}
.bt,.cd{background:var(--card2);color:var(--fg);border:1px solid var(--bd);font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.bt{border-radius:999px;padding:8px 15px}.cd{border-radius:16px;padding:14px 16px}

.bt.on,.cd.on{border-color:var(--ac);box-shadow:var(--glow)}.bt.on{color:var(--ac)}.bt:disabled,.cd:disabled{opacity:.45;cursor:default}

.cd b{font-family:"Noto Serif KR",serif;font-size:17px}
.sm{font-size:13px;color:var(--mute);line-height:1.5}
input{font:inherit;padding:9px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg2);color:var(--fg);min-width:0;flex:1}
input:focus{outline:none;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.err{color:#ff8a8a;font-size:13px}
.cd.plat{position:relative;overflow:hidden;border:1px solid #d7efff;background:linear-gradient(115deg,#18242c 0%,#2f4656 35%,#9fd6f5 50%,#2f4656 65%,#18242c 100%);background-size:250% 100%;animation:pshine 2.6s linear infinite;box-shadow:0 0 22px rgba(160,215,250,.5),0 0 0 1px rgba(220,242,255,.75)}
.cd.plat b{color:#f2faff;text-shadow:0 0 10px rgba(170,225,255,.9)}.cd.plat .sm{color:#c9dbe6}.cd.plat .tag{color:#e6f6ff;border-color:#cfe9ff}
.cd.plat::after{content:"✦  ✧  ✦";position:absolute;right:12px;top:10px;color:#fff;letter-spacing:7px;text-shadow:0 0 8px #bfe8ff;animation:ptw 1.3s ease-in-out infinite}
.bt.plat{border-color:#d7efff;animation:pglow 1.6s ease-in-out infinite alternate}

.st-c.me{border-color:var(--ac);box-shadow:var(--glow)}.st-c b{color:var(--ac2);font-size:14px}
.st-chatbox{flex:1;min-height:0}.st-chat{flex:1;min-height:0;overflow:auto;border:1px solid var(--bd);border-radius:14px;padding:8px 12px;background:var(--bg2);font-size:13px;line-height:1.6}
.st-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st-bar .bt{padding:13px 4px;border-radius:16px;font-size:13px}
.st-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-top:1px solid var(--bd)}.eyebrow+.st-r{border-top:0}
.st-n{flex:1 1 140px;font-weight:500}.st-n small,.st-p small{display:block;font-size:12px;color:var(--mute)}.st-p{width:96px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.st-p small{font-weight:500}
.st-a{display:flex;gap:6px;align-items:center}.st-a .bt{padding:6px 14px}.st-q{flex:none;width:84px;border-radius:999px;padding:6px 10px}
.st-r.lv{background:rgba(240,185,104,.08);border:1px solid rgba(240,185,104,.28);border-radius:14px;padding:8px 12px;margin:2px 0 6px}
.st-u{color:#ff7b7b!important}.st-d{color:#6eaeff!important}
.st-i{border:1px solid var(--bd);border-radius:14px;padding:9px 13px;margin:6px 0;background:var(--bg2)}
.st-ov{position:fixed;inset:0;z-index:50;background:rgba(5,9,12,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}.st-ov>.gcard{width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.6)}.st-ov>.st-pop{max-width:720px;max-height:88dvh;overflow:auto}

const pid="stk"+code;let ok=0;const fl=m=>{errM=m;reset();setup()};const to=setTimeout(()=>{if(!ok)fl("P2P 연결 준비에 실패했어요. 이 페이지가 외부 연결을 막고 있거나 인터넷/방화벽 문제일 수 있어요. 파일로 내려받아 직접 열어 보세요.")},10000);
const hp=new Peer(pid);peer=hp;
hp.on("open",()=>{ok=1;clearTimeout(to);mode="host";lobby={names:[nick],T:cf.T,you:0};show()});
hp.on("connection",c=>{c.on("data",m=>{if(!m)return;
if(m.t=="join"){if(G||conns.length>=4){c.send({t:"full"});return}conns.push(c);let nm=esc(m.nm).trim()||"플레이어";while(lobby.names.includes(nm))nm+="'";lobby.names.push(nm);lobbyBc();show()}
else if(m.t=="act"&&G){const i=conns.indexOf(c);if(i>=0)apply(i+1,m.a)}});
c.on("close",()=>{if(!G){const i=conns.indexOf(c);if(i>=0){conns.splice(i,1);lobby.names.splice(i+1,1);lobbyBc();show()}}})});
hp.on("error",e=>{clearTimeout(to);if(e.type=="unavailable-id"){const g=new Peer();peer=g;g.on("open",()=>{mode="client";show();hconn=g.connect(pid,{reliable:true});setTimeout(()=>{if(mode=="client"&&!lobby&&!G)fl("방장에게 연결하지 못했어요. 다시 시도해 주세요.")},12000);hconn.on("open",()=>{ok=1;hconn.send({t:"join",nm:nick})});hconn.on("data",rx);hconn.on("close",()=>{if(mode=="client"){alert("방과 연결이 끊어졌어요");pg(null)}})});
g.on("error",x=>fl(x.type=="peer-unavailable"?"방을 찾을 수 없습니다.":"연결 오류: "+x.type))}else fl("서버 연결 오류: "+e.type)});
errM="연결 중…";setup()};
const lobbyBc=()=>conns.forEach((c,i)=>c.open&&c.send({t:"lobby",d:{names:lobby.names,T:lobby.T,you:i+1}}));
const rx=m=>{if(!m)return;if(m.t=="lobby"){lobby=m.d;show()}else if(m.t=="g"){G=m.g;lobby=null;rr()}else if(m.t=="chat"){LOG.push(m.m);chat()}else if(m.t=="err")alert(m.m);else if(m.t=="full"){errM="방이 가득 찼거나 이미 시작됐어요.";reset();setup()}};

<div class="gcard"><div class="eyebrow">참가자 ${lobby.names.length}/5</div>${lobby.names.map((n,i)=>`<div class="st-i">${i==0?"👑 ":""}${n}${i==lobby.you?" (나)":""}</div>`).join("")}
${h?`<div class="eyebrow">턴 수</div><div class="row">${[5,10].map(k=>`<button class="bt ${k==lobby.T?"on":""}" onclick="ST.lt(${k})">${k}턴</button>`).join("")}</div><button class="bt pri" onclick="ST.go()" ${lobby.names.length<2?"disabled":""}>게임 시작 ↗</button>`:`<p class="sm">${lobby.T}턴 · 방장이 시작하길 기다리는 중…</p>`}</div>`}

function draw(p,free){if(!G.deck.length)return false;if(!free){if(p.cash<p.cost)return false;p.cash-=p.cost;p.cost+=5000}p.hand.push(G.deck.pop());return true}
function rumor(){const c=pk(G.C);let up=c.next>0;if(Math.random()<.45)up=!up;return{cid:c.id,up,ok:up==(c.next>0)}}
function newRound(){G.C.forEach(c=>c.next=RI(-150,150)/100);G.eff={quake:false,list:[]};G.votes=new Set();G.sec=TS;G.ph="play";
G.P.forEach(p=>{p.rum=Array.from({length:10},rumor);p.spy=null});G.P.forEach(p=>{if(p.ai)aiAct(p)});G.cur=0}
const hum=()=>G.P.map((p,i)=>i).filter(i=>!G.P[i].ai);
const view=i=>{const s=G.P[i].spy;return{T:G.T,round:G.round,sec:G.sec,ph:G.ph,ev:G.ev,res:G.res,votes:[...G.votes],you:i,C:G.C.map(c=>({...c,next:0})),P:G.P.map((q,j)=>j==i?q:{nm:q.nm,ai:q.ai,cash:q.cash,cost:q.cost,hold:s==j?q.hold:{},hl:s==j?q.hl:{},hand:[],btc:[],rum:[]})}};
function bc(){if(mode=="host")conns.forEach((c,i)=>c.open&&c.send({t:"g",g:view(i+1)}));rr()}
function send(a,who){if(mode=="client")hconn.send({t:"act",a});else apply(who==null?ME():who,a)}
function endTurn(){const ch={};G.C.forEach(c=>ch[c.id]=c.next);if(G.eff.quake)G.C.forEach(c=>ch[c.id]=-rf(.01,1.5));
const lv={...ch};G.eff.list.forEach(e=>ch[e.cid]=e.pct);
G.C.forEach(c=>{c.lchg=2*lv[c.id];c.lp=Math.max(100,Math.round(c.lp*(1+c.lchg)));c.chg=ch[c.id];c.price=Math.max(100,Math.round(c.price*(1+c.chg)))});
G.P.forEach(p=>{p.btc.forEach(b=>b.v=Math.max(0,Math.round(b.v*(1+rf(-1,1)))));p.cash+=10000});
const s=[...G.C].sort((a,b)=>b.chg-a.chg);G.ev={u:[s[0].nm,s[0].chg],d:[s[24].nm,s[24].chg],last:G.round>=G.T};G.ph="end";bc()}
const worth=p=>{let s=p.cash;G.C.forEach(c=>s+=(p.hold[c.id]||0)*c.price+(p.hl[c.id]||0)*c.lp);p.btc.forEach(b=>s+=b.v);return s};
function apply(pi,a){const p=G.P[pi];if(!p||G.ph=="over")return;const E=m=>{if(mode=="host"&&pi>0)conns[pi-1].send({t:"err",m});else alert(m)};
if(a.k=="next"){if(G.ph!="end"||(mode!="local"&&pi!=0))return;if(G.ev.last){G.res=G.P.map(q=>({nm:q.nm,w:worth(q)})).sort((x,y)=>y.w-x.w);G.ph="over"}else{G.round++;newRound()}return bc()}
if(G.ph!="play")return;
if(a.k=="chat"){const m=p.nm+": "+esc(a.m).slice(0,200);LOG.push(m);if(mode=="host")conns.forEach(c=>c.open&&c.send({t:"chat",m}));return chat()}
if(a.k=="trade"){const c=G.C[a.cid];if(!c)return;const h=a.L?p.hl:p.hold,pr=a.L?c.lp:c.price,n=Math.max(1,Math.floor(+a.n||1));
if(a.b){if(p.cash<pr*n)return E("현금이 부족합니다");p.cash-=pr*n;h[a.cid]=(h[a.cid]||0)+n}else{const s=Math.min(h[a.cid]||0,n);if(!s)return;p.cash+=s*pr;h[a.cid]-=s}}
else if(a.k=="draw"){if(!draw(p))return E("돈이 부족하거나 덱이 비었습니다")}
else if(a.k=="sell"){const b=p.btc[a.j];if(!b)return;p.cash+=b.v;p.btc.splice(a.j,1)}
else if(a.k=="use"){const k=p.hand[a.i];if(k==null)return;const setE=(id,pct)=>{G.eff.list=G.eff.list.filter(e=>e.cid!=id);G.eff.list.push({cid:id,pct})};
if(k==0||k==3){if(!G.C[a.arg])return;setE(a.arg,k==0?-rf(.5,2):rf(.5,2))}
else if(k==1){if(!G.P[a.arg]||a.arg==pi)return;p.spy=a.arg}
else if(k==2)G.eff.quake=true;
else if(k==4){let r;do r=rumor();while(!r.ok);r.real=true;p.rum.unshift(r)}
else if(k==5)p.cash+=30000;else p.btc.push({v:50000});p.hand.splice(a.i,1)}
else if(a.k=="skip"){G.votes.has(pi)?G.votes.delete(pi):G.votes.add(pi);if(G.votes.size>hum().length/2)return endTurn()}
bc()}

function aiAct(p){for(let n=0;n<4;n++){const r=Math.random();
if(r<.4){const c=pk(G.C),q=Math.floor(p.cash/c.price);if(q>0){const b=RI(1,Math.min(q,5));p.cash-=b*c.price;p.hold[c.id]=(p.hold[c.id]||0)+b}}
else if(r<.6){const h=Object.keys(p.hold).filter(k=>p.hold[k]>0);if(h.length){const k=pk(h);p.cash+=p.hold[k]*G.C[k].price;p.hold[k]=0}}
else if(r<.8)draw(p);else if(p.hand.length){const i=RI(0,p.hand.length-1),k=p.hand[i];let u=1;
if(k==0||k==3){G.eff.list.push({cid:pk(G.C).id,pct:k==0?-rf(.5,2):rf(.5,2)})}else if(k==2)G.eff.quake=true;else if(k==5)p.cash+=30000;else if(k==6)p.btc.push({v:50000});else u=0;if(u)p.hand.splice(i,1)}}
if(p.btc.length&&Math.random()<.4){p.cash+=p.btc[0].v;p.btc.shift()}}
